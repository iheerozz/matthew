<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MiniZ Présentation 3 — Présentez ces personnes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F26A21;
  --orange-dark:#D8551A;
  --blue:#1FA3DC;
  --blue-dark:#1276A6;
  --zone:#DCE3F6;
  --zone-border:#BBD5EC;
  --ink:#1B4D6B;
  --ok:#1B8A4B;
  --ko:#C62828;
  --ui:14px;
  --fs-bank:16px;
  --fs-drop:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:#EEF2F7;padding:6px;
  -webkit-user-select:none;user-select:none;
}
.frame{
  height:100%;display:flex;flex-direction:column;
  border:5px solid var(--orange);border-radius:18px;
  background:#fff;overflow:hidden;
}

/* ---------- Barre de titre ---------- */
.topbar{
  background:var(--orange);color:#fff;display:flex;align-items:center;gap:14px;
  padding:5px 14px;flex-shrink:0;
}
.topbar h1{font-size:calc(var(--ui) + 3px);font-weight:700}
.chrono{
  margin-left:auto;display:flex;align-items:center;gap:10px;
}
.chrono .time{
  background:#fff;color:var(--orange);border-radius:999px;
  padding:1px 14px;font-weight:800;font-size:calc(var(--ui) + 8px);
  font-variant-numeric:tabular-nums;letter-spacing:.5px;line-height:1.25;
}
.chrono .time.running{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.chrono .time.done{background:#123F1F;color:#8FE9AF}
.chrono .beat{font-size:calc(var(--ui) - 2px);font-weight:600;line-height:1.15;text-align:right;opacity:.95}
.tag{font-weight:600;font-size:var(--ui);display:flex;align-items:center;gap:6px}
.tag .num{width:21px;height:21px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}

/* ---------- Personnages ---------- */
.people{
  flex:1 1 auto;display:grid;grid-template-columns:repeat(6,1fr);
  gap:8px;padding:8px 10px 6px;min-height:0;
}
.person{display:flex;flex-direction:column;min-height:0}
.person img{
  height:38%;min-height:0;width:100%;object-fit:contain;object-position:bottom;
  margin-bottom:4px;pointer-events:none;
}
.drop{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  background:var(--zone);border:2px solid var(--zone-border);border-radius:6px;
  padding:4px;display:flex;flex-direction:column;gap:4px;transition:.12s;
}
.drop.over{border-color:var(--orange);background:#FFE8D8;border-style:dashed}
.drop.armed{border-color:var(--orange)}

/* ---------- Banque de phrases ---------- */
.bankwrap{
  flex-shrink:0;height:36vh;display:flex;flex-direction:column;
  border-top:3px solid var(--zone-border);background:#F8FBFE;padding:6px 10px 8px;
}
.bankhead{display:flex;align-items:center;gap:10px;margin-bottom:5px;flex-shrink:0}
.bankhead h2{font-size:var(--ui);color:var(--blue-dark);font-weight:700}
.bankhead .count{font-size:calc(var(--ui) - 1px);color:var(--ink);font-weight:600}
.tools{display:flex;gap:6px}
.tools button{
  font-family:inherit;font-size:calc(var(--ui) - 1px);font-weight:600;
  border:2px solid var(--orange);background:#fff;color:var(--orange);
  padding:2px 11px;border-radius:999px;cursor:pointer;transition:.15s;
}
.tools button:hover{background:var(--orange);color:#fff}
.tools button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bubble{
  margin-left:auto;border:2px dashed var(--orange);border-radius:12px;
  padding:2px 12px;color:var(--orange);font-weight:600;
  font-size:calc(var(--ui) - 3px);text-align:center;line-height:1.2;background:#fff;
}
.bank{
  flex:1 1 auto;min-height:0;overflow:hidden;
  display:grid;grid-template-columns:repeat(4,1fr);
  align-content:stretch;gap:5px;
}
.bank.over{outline:2px dashed var(--orange);outline-offset:4px;border-radius:6px}

/* ---------- Étiquettes ---------- */
.chip{
  display:flex;align-items:center;gap:.5em;
  background:#fff;border:2px solid var(--blue);border-radius:6px;
  color:var(--blue-dark);font-weight:600;line-height:1.15;
  padding:3px 8px;cursor:grab;transition:background .12s,transform .12s;
}
.chip::before{
  content:"";width:.75em;height:.75em;flex-shrink:0;
  border:2px solid var(--blue);border-radius:2px;background:#fff;
}
.bank .chip{font-size:var(--fs-bank)}
.drop .chip{font-size:var(--fs-drop);width:100%}
.chip:hover{background:#EAF7FE}
.chip.dragging{opacity:.35}
.chip.picked{background:var(--orange);border-color:var(--orange-dark);color:#fff;transform:scale(1.02)}
.chip.picked::before{border-color:#fff;background:var(--orange-dark)}
.chip.ok{border-color:var(--ok);border-width:3px;background:#EAF7EF}
.chip.ok::after{content:"\2714";margin-left:auto;color:var(--ok);font-weight:800}
.chip.ko{border-color:var(--ko);border-style:dashed;border-width:3px;background:#FDEDED}
.chip.ko::after{content:"\2718";margin-left:auto;color:var(--ko);font-weight:800}
.chip:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* ---------- Fenêtre chrono / classement ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(20,40,55,.55);
  display:none;place-items:center;z-index:50;padding:20px;
}
.overlay.show{display:grid}
.modal{
  background:#fff;border:5px solid var(--orange);border-radius:20px;
  padding:18px 24px 20px;min-width:380px;max-width:520px;max-height:88vh;overflow:auto;
  text-align:center;
}
.modal h3{color:var(--orange);font-size:calc(var(--ui) + 8px);font-weight:800;margin-bottom:2px}
.modal .sub{color:var(--ink);font-size:var(--ui);margin-bottom:12px}
.modal .big{
  font-size:calc(var(--ui) + 30px);font-weight:800;color:var(--blue-dark);
  font-variant-numeric:tabular-nums;line-height:1.05;margin:6px 0 12px;
}
.saverow{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.saverow select,.saverow button{
  font-family:inherit;font-size:var(--ui);font-weight:600;padding:6px 14px;
  border-radius:999px;border:2px solid var(--blue);color:var(--blue-dark);background:#fff;cursor:pointer;
}
.saverow button{background:var(--orange);border-color:var(--orange);color:#fff}
.saverow button:hover{background:var(--orange-dark)}
.board{width:100%;border-collapse:collapse;font-size:var(--ui);margin-top:4px}
.board th{
  text-align:left;color:var(--blue-dark);font-weight:700;
  border-bottom:2px solid var(--zone-border);padding:5px 6px;font-size:calc(var(--ui) - 2px);
}
.board td{padding:5px 6px;border-bottom:1px solid #E8EEF5;color:var(--ink);font-weight:600}
.board td.rank{width:2.4em;font-weight:800;color:var(--orange)}
.board td.t{font-variant-numeric:tabular-nums;text-align:right;font-weight:800}
.board tr.fresh td{background:#FFF1E6}
.board tr.fresh td.rank::after{content:" \2605"}
.board .empty{color:#7A8FA0;font-weight:500;padding:14px 6px}
.modal .close{
  margin-top:14px;font-family:inherit;font-size:var(--ui);font-weight:600;
  border:2px solid var(--orange);background:#fff;color:var(--orange);
  padding:5px 20px;border-radius:999px;cursor:pointer;
}
.modal .close:hover{background:var(--orange);color:#fff}
.modal .note{font-size:calc(var(--ui) - 2px);color:#7A8FA0;margin-top:10px;line-height:1.35}
.modal .wipe{
  background:none;border:none;color:#9AA9B4;font-size:calc(var(--ui) - 3px);
  text-decoration:underline;cursor:pointer;font-family:inherit;margin-top:8px;
}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="frame">

  <div class="topbar">
    <h1>Présentez ces personnes avec 4 phrases différentes.</h1>
    <div class="chrono">
      <div class="beat" id="beat"></div>
      <div class="time" id="time">0:00.0</div>
    </div>
    <div class="tag">MiniZ Présentation <span class="num">3</span></div>
  </div>

  <div class="people" id="people"></div>

  <div class="bankwrap">
    <div class="bankhead">
      <h2>Phrases à placer</h2>
      <span class="count" id="count"></span>
      <div class="tools">
        <button id="btn-check">Vérifier</button>
        <button id="btn-board">Classement</button>
        <button id="btn-solution">Corriger</button>
        <button id="btn-reset">Recommencer</button>
      </div>
      <div class="bubble">« Il est pilote de ligne.<br>Je crois que c'est Mark Davis. »</div>
    </div>
    <div class="bank" id="bank"></div>
  </div>

</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

const modal    = document.getElementById('modal');
let picked = null, dragged = null;

/* ================= CHRONO ================= */
let t0 = null, tick = null, finalMs = null, tainted = false;

function fmt(ms){
  const m = Math.floor(ms/60000);
  const s = Math.floor(ms%60000/1000);
  const d = Math.floor(ms%1000/100);
  return m + ":" + String(s).padStart(2,'0') + "." + d;
}
function startChrono(){
  if(t0 !== null || finalMs !== null) return;
  t0 = performance.now();
  timeEl.classList.add('running');
  tick = setInterval(()=>{ timeEl.textContent = fmt(performance.now() - t0); }, 100);
}
function stopChrono(){
  if(t0 === null) return null;
  clearInterval(tick); tick = null;
  finalMs = performance.now() - t0;
  t0 = null;
  timeEl.textContent = fmt(finalMs);
  timeEl.classList.remove('running');
  timeEl.classList.add('done');
  return finalMs;
}
function resetChrono(){
  clearInterval(tick); tick = null; t0 = null; finalMs = null; tainted = false;
  timeEl.textContent = "0:00.0";
  timeEl.classList.remove('running','done');
}

/* ================= RECORDS ================= */
function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(STORE)) || {}; }catch(e){ return {}; }
}
function saveRecords(r){
  try{ localStorage.setItem(STORE, JSON.stringify(r)); }catch(e){}
}
function showBeat(){
  const r = loadRecords();
  const best = Object.entries(r).sort((a,b)=>a[1].ms-b[1].ms)[0];
  beatEl.innerHTML = best ? "Record à battre<br><strong>" + best[0] + " — " + fmt(best[1].ms) + "</strong>" : "";
}

/* ================= PLATEAU ================= */
PEOPLE.forEach(p=>{
  const col = document.createElement('div');
  col.className = 'person';
  const img = document.createElement('img');
  img.src = IMG[p.id]; img.alt = p.name;
  const zone = document.createElement('div');
  zone.className = 'drop'; zone.dataset.person = p.id;
  col.append(img, zone);
  peopleEl.appendChild(col);
  wireZone(zone);
});
wireZone(bankEl);
const zoneOf = id => document.querySelector('.drop[data-person="'+id+'"]');

const chips = shuffle(SENTENCES.slice()).map(s=>{
  const chip = document.createElement('div');
  chip.className = 'chip'; chip.draggable = true; chip.tabIndex = 0;
  chip.dataset.owner = s.o;
  chip.append(document.createTextNode(s.t));
  chip.addEventListener('dragstart', e=>{
    dragged = chip; chip.classList.add('dragging');
    e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain','x');
  });
  chip.addEventListener('dragend', ()=>{chip.classList.remove('dragging'); dragged=null;});
  chip.addEventListener('click', e=>{e.stopPropagation(); pick(chip);});
  chip.addEventListener('keydown', e=>{
    if(e.key==='Enter'||e.key===' '){e.preventDefault(); pick(chip);}
  });
  bankEl.appendChild(chip);
  return chip;
});

function wireZone(zone){
  zone.addEventListener('dragover', e=>{e.preventDefault(); zone.classList.add('over');});
  zone.addEventListener('dragleave', ()=> zone.classList.remove('over'));
  zone.addEventListener('drop', e=>{
    e.preventDefault(); zone.classList.remove('over');
    if(dragged) place(dragged, zone);
  });
  zone.addEventListener('click', ()=>{ if(picked) place(picked, zone); });
}
function pick(chip){
  if(picked===chip){clearPick(); return;}
  clearPick(); picked = chip; chip.classList.add('picked');
  document.querySelectorAll('.drop').forEach(z=>z.classList.add('armed'));
  bankEl.classList.add('over');
}
function clearPick(){
  if(picked) picked.classList.remove('picked');
  picked = null;
  document.querySelectorAll('.drop').forEach(z=>z.classList.remove('armed'));
  bankEl.classList.remove('over');
}
function place(chip, zone){
  if(finalMs !== null) return;
  startChrono();
  chip.classList.remove('ok','ko');
  zone.appendChild(chip);
  clearPick(); refresh();
  if(allCorrect()) win();
}
document.addEventListener('click', e=>{ if(!overlay.classList.contains('show')) clearPick(); });

function allCorrect(){
  return bankEl.querySelectorAll('.chip').length === 0 &&
         chips.every(c => c.parentElement.dataset.person === c.dataset.owner);
}
function refresh(){
  const left = bankEl.querySelectorAll('.chip').length;
  countEl.textContent = left===0 ? "Toutes les phrases sont placées."
                                 : left + (left>1 ? " phrases restantes" : " phrase restante");
}

/* ================= BOUTONS ================= */
document.getElementById('btn-check').addEventListener('click', e=>{
  e.stopPropagation();
  document.querySelectorAll('.drop').forEach(z=>{
    [...z.children].forEach(c=>{
      const good = c.dataset.owner === z.dataset.person;
      c.classList.toggle('ok', good); c.classList.toggle('ko', !good);
    });
  });
});
document.getElementById('btn-solution').addEventListener('click', e=>{
  e.stopPropagation();
  tainted = true;
  chips.forEach(c=>{ zoneOf(c.dataset.owner).appendChild(c); c.classList.remove('ko'); c.classList.add('ok'); });
  refresh(); stopChrono();
});
document.getElementById('btn-reset').addEventListener('click', e=>{
  e.stopPropagation();
  shuffle(chips.slice()).forEach(c=>{ c.classList.remove('ok','ko'); bankEl.appendChild(c); });
  resetChrono(); refresh(); showBeat();
});
document.getElementById('btn-board').addEventListener('click', e=>{
  e.stopPropagation(); openBoard();
});
overlay.addEventListener('click', e=>{ if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });
function closeModal(){ overlay.classList.remove('show'); }

/* ================= FIN DE PARTIE ================= */
function win(){
  const ms = stopChrono();
  chips.forEach(c=>c.classList.add('ok'));
  if(ms === null) return;
  if(tainted){ openBoard("Temps non enregistré : le corrigé a été affiché."); return; }
  openWin(ms);
}

function openWin(ms){
  const r = loadRecords();
  modal.innerHTML =
    '<h3>Terminé !</h3>' +
    '<div class="sub">Les 29 phrases sont à la bonne personne.</div>' +
    '<div class="big">' + fmt(ms) + '</div>' +
    '<div class="saverow">' +
      '<select id="cls"><option value="">Choisir la classe…</option>' +
      CLASSES.map(c=>'<option value="'+c+'">'+c+'</option>').join('') +
      '</select><button id="save">Enregistrer le temps</button>' +
    '</div>' +
    boardHTML(r, null) +
    '<button class="close">Fermer</button>';
  overlay.classList.add('show');
  modal.querySelector('.close').addEventListener('click', closeModal);
  modal.querySelector('#save').addEventListener('click', ()=>{
    const cls = modal.querySelector('#cls').value;
    if(!cls){ modal.querySelector('#cls').focus(); return; }
    const recs = loadRecords();
    const prev = recs[cls];
    if(!prev || ms < prev.ms){
      recs[cls] = {ms:ms, date:new Date().toLocaleDateString('fr-FR')};
      saveRecords(recs);
      openBoard(prev ? "Nouveau record pour " + cls + " ! Ancien temps : " + fmt(prev.ms)
                     : "Premier temps enregistré pour " + cls + ".", cls);
    }else{
      openBoard(cls + " garde son record de " + fmt(prev.ms) + ". Ce temps-ci : " + fmt(ms) + ".", cls);
    }
    showBeat();
  });
}

function boardHTML(r, fresh){
  const rows = Object.entries(r).sort((a,b)=>a[1].ms-b[1].ms);
  if(!rows.length) return '<table class="board"><tr><td class="empty">Aucun temps enregistré pour l\'instant.</td></tr></table>';
  return '<table class="board"><tr><th></th><th>Classe</th><th>Date</th><th style="text-align:right">Temps</th></tr>' +
    rows.map((e,i)=>
      '<tr class="'+(e[0]===fresh?'fresh':'')+'"><td class="rank">'+(i+1)+'</td>' +
      '<td>'+e[0]+'</td><td style="font-weight:500;color:#7A8FA0">'+e[1].date+'</td>' +
      '<td class="t">'+fmt(e[1].ms)+'</td></tr>').join('') +
    '</table>';
}

function openBoard(msg, fresh){
  const r = loadRecords();
  modal.innerHTML =
    '<h3>Classement des classes</h3>' +
    '<div class="sub">La classe la plus rapide gagne.</div>' +
    (msg ? '<div class="note" style="color:var(--orange);font-weight:600;font-size:var(--ui)">'+msg+'</div>' : '') +
    boardHTML(r, fresh || null) +
    '<button class="close">Fermer</button>' +
    '<div><button class="wipe">Effacer tous les temps</button></div>';
  overlay.classList.add('show');
  modal.querySelector('.close').addEventListener('click', closeModal);
  modal.querySelector('.wipe').addEventListener('click', ()=>{
    saveRecords({}); showBeat(); openBoard("Classement remis à zéro.");
  });
}

/* ================= CALIBRAGE ================= */
function fits(el){ return el.scrollHeight <= el.clientHeight + 1; }
function zonesFit(){ return [...document.querySelectorAll('.drop')].every(fits); }
function calibrate(){
  const home = chips.map(c=>c.parentElement);
  chips.forEach(c=>bankEl.appendChild(c));
  let s = 30; R.style.setProperty('--fs-bank', s+'px');
  while(s>9 && !fits(bankEl)){ s-=0.5; R.style.setProperty('--fs-bank', s+'px'); }
  chips.forEach(c=> zoneOf(c.dataset.owner).appendChild(c));
  let d = 22; R.style.setProperty('--fs-drop', d+'px');
  while(d>8 && !zonesFit()){ d-=0.5; R.style.setProperty('--fs-drop', d+'px'); }
  chips.forEach((c,i)=> home[i].appendChild(c));
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }

let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(calibrate,150); });
refresh(); showBeat();
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(calibrate); } else { calibrate(); }
window.addEventListener('load', calibrate);
</script>
</body>
</html>
