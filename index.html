<style>
:root{
  --sky:#2196d8;
  --ink:#243244;
  --slate:#5D6B7E;
  --dim:#8794A6;
  --line:#E4EAF2;
  --nav-h:58px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Hanken Grotesk',system-ui,sans-serif;
  color:var(--ink);
  display:flex;flex-direction:column;
  background:#F6F8FB;
}
/* ===== barre de navigation ===== */
nav{
  height:var(--nav-h);flex-shrink:0;
  display:flex;align-items:center;gap:28px;
  padding:0 clamp(16px,3vw,36px);
  background:#fff;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;margin-right:8px}
.brand svg{width:26px;height:34px}
.brand span{font-weight:800;font-size:.95rem;letter-spacing:1px;color:var(--sky)}
.tabs{display:flex;gap:4px;height:100%}
.tab{
  display:flex;align-items:center;
  padding:0 16px;height:100%;
  font-weight:600;font-size:.92rem;color:var(--slate);
  text-decoration:none;border-bottom:3px solid transparent;
  transition:color .15s,border-color .15s;
  white-space:nowrap;
}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--sky);border-bottom-color:var(--sky)}
.tab:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}

/* ===== témoin de sauvegarde ===== */
.save{
  margin-left:auto;display:flex;align-items:center;gap:7px;
  font-family:inherit;font-size:.78rem;font-weight:600;
  border:1.5px solid var(--line);background:#fff;color:var(--dim);
  border-radius:999px;padding:5px 13px;cursor:pointer;white-space:nowrap;
  transition:color .15s,border-color .15s,background .15s;
}
.save:hover{color:var(--ink);border-color:#CBD8E6}
.save .led{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.save.ok{color:#1F9D6B;border-color:#BFE7D5;background:#F1FBF6}
.save.warn{color:#C2410C;border-color:#F5D5BC;background:#FEF6EF}
.save.busy .led{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.save:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

/* ===== contenu ===== */
main{flex:1;position:relative;min-height:0}
iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:0;display:none;background:#F6F8FB;
}
iframe.visible{display:block}
@media (max-width:700px){
  body{padding-bottom:env(safe-area-inset-bottom)}
  nav{
    padding-top:env(safe-area-inset-top);
    height:calc(var(--nav-h) + env(safe-area-inset-top));
  }
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  nav{gap:14px}
  .brand span{display:none}
  .tab{padding:0 10px;font-size:.85rem}
  .save span.txt{display:none}
  .save{padding:5px 9px}
}
</style>
</head>

    <a class="tab" href="#jigsaw" data-frame="frame-jigsaw" role="tab">Jigsaw Method</a>
    <a class="tab" href="#participation" data-frame="frame-participation" role="tab">Participation</a>
    <a class="tab" href="#calendrier" data-frame="frame-calendrier" role="tab">Mon emploi du temps</a>
    <a class="tab" href="#annee" data-frame="frame-annee" role="tab">Calendrier scolaire</a>
    <a class="tab" href="#exercices" data-frame="frame-exercices" role="tab">Exercices</a>
    <a class="tab" href="#jeux" data-frame="frame-jeux" role="tab">Jeux</a>
  </div>
  <button class="save" id="save" title="Sauvegarde"><span class="led"></span><span class="txt">Sauvegarde</span></button>
</nav>
<main>
  <iframe id="frame-jigsaw" title="Jigsaw Method"></iframe>
  <iframe id="frame-participation" title="Participation en classe"></iframe>
  <iframe id="frame-calendrier" title="Mon emploi du temps"></iframe>
  <iframe id="frame-annee" title="Calendrier scolaire 2026-2027"></iframe>
  <iframe id="frame-exercices" title="Exercices"></iframe>
  <iframe id="frame-jeux" title="Jeux"></iframe>
</main>

<script>
/* ══════════════════════════════════════════════════════════
   SAUVEGARDE AUTOMATIQUE
   Tous les outils partagent le même stockage de navigateur.
   1. copie permanente dans une seconde base (IndexedDB)
   2. écriture dans un fichier du disque, si un fichier a été choisi
   3. restauration silencieuse au chargement si des données manquent
   ══════════════════════════════════════════════════════════ */
const DB = "stmatthew-backup", STORE = "kv";
const HAS_FS = typeof window.showSaveFilePicker === "function";
let handle = null, dirty = false, timer = null;

function idb(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result);
    r.onerror  = () => rej(r.error);
  });
}
async function idbGet(k){
  const db = await idb();
  return new Promise((res,rej)=>{
    const r = db.transaction(STORE,"readonly").objectStore(STORE).get(k);
    r.onsuccess = ()=>res(r.result); r.onerror = ()=>rej(r.error);
  });
}
async function idbSet(k, v){
  const db = await idb();
  return new Promise((res,rej)=>{
    const t = db.transaction(STORE,"readwrite");
    t.objectStore(STORE).put(v, k);
    t.oncomplete = ()=>res(); t.onerror = ()=>rej(t.error);
  });
}

/* photo de tout ce que les outils ont enregistré */
function snapshot(){
  const o = {};
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    o[k] = localStorage.getItem(k);
  }
  return o;
}
/* ne remet que ce qui manque : on n'écrase jamais des données présentes */
function restoreMissing(saved){
  let n = 0;
  for(const k in saved){
    if(localStorage.getItem(k) === null){ localStorage.setItem(k, saved[k]); n++; }
  }
  return n;
}

async function writeFile(data){
  if(!handle) return false;
  const perm = await handle.queryPermission({mode:"readwrite"});
  if(perm !== "granted") return false;              // on ne peut pas demander sans clic
  const w = await handle.createWritable();
  await w.write(JSON.stringify({saved:new Date().toISOString(), data}, null, 2));
  await w.close();
  return true;
}

async function persist(){
  const data = snapshot();
  try{ await idbSet("snapshot", {at:Date.now(), data}); }catch(e){}
  let onDisk = false;
  try{ onDisk = await writeFile(data); }catch(e){}
  dirty = false;
  status(onDisk ? "ok" : (handle ? "warn" : ""), onDisk ? "Sauvegardé" : (handle ? "Reconnecter" : "Sauvegarde"));
}
function schedule(){
  dirty = true;
  clearTimeout(timer);
  timer = setTimeout(persist, 1500);              // on attend la fin des clics
}

function status(cls, txt){
  const b = document.getElementById("save");
  b.className = "save" + (cls ? " " + cls : "");
  b.querySelector(".txt").textContent = txt;
  b.title = txt === "Reconnecter"
    ? "Cliquez pour réautoriser l'écriture dans votre fichier de sauvegarde"
    : (handle ? "Sauvegarde automatique dans votre fichier" : "Choisir un fichier de sauvegarde");
}

/* clic : choisir un fichier, ou réautoriser celui qui existe */
document.getElementById("save").addEventListener("click", async ()=>{
  try{
    if(handle){
      const p = await handle.requestPermission({mode:"readwrite"});
      if(p === "granted"){ await persist(); return; }
    }
    if(!HAS_FS){
      alert("Ce navigateur ne peut pas écrire dans un fichier.\nVos données restent sauvegardées dans le navigateur.\nUtilisez Chrome ou Edge pour la sauvegarde sur disque.");
      return;
    }
    handle = await window.showSaveFilePicker({
      suggestedName: "sauvegarde-outils-st-matthew.json",
      types: [{description:"Sauvegarde", accept:{"application/json":[".json"]}}]
    });
    await idbSet("handle", handle);
    await persist();
  }catch(e){ /* annulé par l'utilisateur */ }
});

/* ── démarrage ── */
async function boot(){
  try{ handle = await idbGet("handle") || null; }catch(e){}

  // restauration silencieuse : fichier d'abord, sinon copie interne
  let saved = null;
  try{
    if(handle && await handle.queryPermission({mode:"read"}) === "granted"){
      saved = JSON.parse(await (await handle.getFile()).text()).data;
    }
  }catch(e){}
  if(!saved){
    try{ saved = (await idbGet("snapshot") || {}).data || null; }catch(e){}
  }
  if(saved){
    const n = restoreMissing(saved);
    if(n) console.log("Sauvegarde : " + n + " élément(s) restauré(s).");
  }

  status(handle ? "ok" : "", handle ? "Sauvegardé" : "Sauvegarde");
  if(!handle && !HAS_FS) status("", "Sauvegarde");

  show(location.hash || "#jigsaw");               // les outils démarrent après restauration
  await persist();

  window.addEventListener("storage", schedule);   // un outil a écrit quelque chose
  setInterval(()=>{                               // filet de sécurité
    const now = JSON.stringify(snapshot());
    if(now !== boot._last){ boot._last = now; schedule(); }
  }, 4000);
  boot._last = JSON.stringify(snapshot());
}
window.addEventListener("beforeunload", ()=>{ if(dirty) persist(); });

/* ══ onglets ══ */
const SOURCES = {
  'frame-jigsaw': 'jigsaw.html',
  'frame-participation': 'participation.html',
  'frame-calendrier': 'calendar.html',
  'frame-annee': 'annee.html',
  'frame-exercices': 'exercices.html',
  'frame-jeux': 'jeux.html'
};
const tabs = document.querySelectorAll('.tab');
function show(hash){
  const target = document.querySelector(`.tab[href="${hash}"]`) || tabs[0];
  tabs.forEach(t => t.classList.toggle('active', t === target));
  const frameId = target.dataset.frame;
  document.querySelectorAll('iframe').forEach(f => {
    if (f.id === frameId && !f.src) f.src = SOURCES[f.id]; // chargé une seule fois : l'état est conservé
    f.classList.toggle('visible', f.id === frameId);
  });
}
tabs.forEach(t => t.addEventListener('click', e => {
  e.preventDefault();
  history.replaceState(null, '', t.getAttribute('href'));
  show(t.getAttribute('href'));
}));

boot();
</script>
</body>
</html>
