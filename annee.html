<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Calendar 2026–2027 · St. Matthew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#1b2a4a;
  --rule:#dbe4ee;
  --muted:#7a8698;
  --card:#ffffff;
  --rouge:#E2231A;
  --ferie:#B3261E;
  /* couleurs des événements (mêmes teintes que l'emploi du temps) */
  --c-term:#111111;
  --c-test:#9C4A00;
  --c-break:#1F7A68;
  --c-holiday:#B3261E;
  --c-noschool:#8578E0;
  --c-special:#E2231A;
  --c-jean:#F0B31A;
  --c-event:#DE9CBE;
  --c-work:#55391C;
  --c-staff:#5D6B7E;
  --c-other:#9DD1F5;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:'Jost',sans-serif;color:var(--encre);
  background:
    radial-gradient(820px 520px at 92% -12%, rgba(42,169,224,.28), transparent 60%),
    radial-gradient(680px 460px at -8% 14%, rgba(122,111,240,.14), transparent 55%),
    linear-gradient(160deg,#DCEEFF 0%,#E6ECFA 42%,#EAF3F1 76%,#F6F8FB 100%);
  background-attachment:fixed;
  min-height:100vh;
  padding:12px clamp(18px,2.4vw,44px) 14px;
  display:flex;flex-direction:column;
}
.wrap{width:100%;flex:1;display:flex;flex-direction:column;min-height:0}

/* ── en-tête : identique à My Week ── */
.logocard{
  background:#fff;border-radius:12px;padding:8px 18px 6px;
  display:flex;justify-content:center;margin-bottom:8px;flex:0 0 auto;
  box-shadow:0 4px 14px rgba(27,42,74,.10);
}
.logocard img{max-height:44px;width:auto;max-width:100%}
.plaque{
  background:var(--encre);
  border:3px solid #fff;
  outline:3px solid var(--encre);
  border-radius:10px;
  color:#fff;text-align:center;
  padding:9px 20px 8px;flex:0 0 auto;
  box-shadow:0 6px 18px rgba(27,42,74,.28);
}
.plaque h1{
  font-weight:800;font-size:clamp(18px,3vw,26px);
  letter-spacing:.16em;text-transform:uppercase;line-height:1.05;
}
.plaque .sub{
  margin-top:4px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#b9c4dd;
}

/* ── navigation du mois ── */
.monthbar{display:flex;align-items:center;gap:10px;margin:10px 0 8px;flex:0 0 auto;flex-wrap:wrap}
.btn{
  font-family:'Jost',sans-serif;font-weight:600;font-size:12px;letter-spacing:.04em;
  border:1.5px solid var(--encre);background:#fff;color:var(--encre);
  border-radius:999px;padding:6px 14px;cursor:pointer;transition:transform .12s;
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.3;cursor:not-allowed;transform:none}
.btn:focus-visible{outline:3px solid var(--rouge);outline-offset:2px}
.btn.nav{padding:6px 13px;font-size:15px;line-height:1}
.mtitle{font-weight:800;font-size:clamp(26px,4.4vw,44px);letter-spacing:.01em;line-height:1;min-width:230px;text-transform:uppercase}
.mtitle .m-yr{color:#1F7A68;font-weight:700;margin-left:10px;font-size:.62em;letter-spacing:.02em}
.spacer{flex:1}

/* ── grille ── */
.gridwrap{flex:1 1 auto;min-height:430px;display:flex}
.grid{
  display:grid;grid-template-columns:30px repeat(7,1fr);
  grid-template-rows:auto;            /* la rangée des jours garde sa hauteur naturelle */
  grid-auto-rows:minmax(76px,1fr);width:100%;
  background:var(--card);border:2px solid var(--encre);border-radius:12px;overflow:hidden;
  box-shadow:0 10px 26px rgba(27,42,74,.14);
}
.dh{
  background:var(--encre);color:#fff;text-align:center;
  font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 2px;
}
.dh.we{background:#2c3e60;color:#b9c4dd}
.wk{
  background:#f7fafd;border-right:1px solid var(--rule);border-top:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;
  font-family:'Jost',sans-serif;font-weight:600;font-size:10px;color:var(--muted);
  letter-spacing:.04em;white-space:nowrap;
  writing-mode:vertical-rl;transform:rotate(180deg);
}
.cell{
  border-right:1px solid var(--rule);border-top:1px solid var(--rule);
  padding:4px 5px 5px;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;gap:2px;position:relative;
}
.cell:nth-child(8n){border-right:none}
/* week-end : nettement grisé */
.cell.we{background:#E9EDF3}
.cell.we .num{color:#9aa6b6}
.cell.out{background:#fbfcfd}
.cell.out.we{background:#F1F4F8}
.cell.out .num{color:#c3ccd8}
.num{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);flex:0 0 auto}

/* jour férié : bien visible */
.cell.ferie{background:#FBE9E7;box-shadow:inset 0 0 0 2px var(--ferie)}
.cell.ferie.we{background:#F6DEDB}
.cell.ferie .num{color:var(--ferie);font-weight:700}
.cell.ferie::after{
  content:"HOLIDAY";position:absolute;top:4px;right:5px;
  font-family:'Space Mono',monospace;font-size:7.5px;letter-spacing:.12em;
  color:var(--ferie);opacity:.75;
}

/* aujourd'hui : rempli en bleu à l'intérieur, sans contour */
.cell.today{background:#DCEBFA}
.cell.today.we{background:#CFE2F5}
.cell.today .num{
  background:#2196d8;color:#fff;font-weight:700;
  border-radius:999px;padding:1px 7px;align-self:flex-start;
}
.cell.ferie.today{background:#DCEBFA}

.ev{
  font-size:10.5px;line-height:1.2;padding:2px 4px 2px 5px;border-radius:3px;
  border-left:3px solid var(--k);
  background:color-mix(in srgb,var(--k) 16%,#fff);
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.ev.big{font-weight:700}
.ev.holiday{font-weight:700;color:var(--ferie)}
.more{font-size:9.5px;color:var(--muted);font-family:'Space Mono',monospace}

footer{
  margin-top:9px;flex:0 0 auto;text-align:center;
  font-size:11px;color:var(--muted);letter-spacing:.02em;
}

@media (max-width:760px){
  .grid{grid-template-columns:26px repeat(7,1fr);grid-auto-rows:minmax(62px,1fr)}
  .ev{font-size:9px}
}
</style>
</head>

const WEEKS={"2026-08-17":1,"2026-08-24":2,"2026-08-31":3,"2026-09-07":4,"2026-09-14":5,"2026-09-21":6,"2026-09-28":7,"2026-10-12":8,"2026-10-19":9,"2026-10-26":10,"2026-11-02":11,"2026-11-09":12,"2026-11-16":13,"2026-11-23":14,"2026-11-30":15,"2026-12-07":16,"2027-01-11":17,"2027-01-18":18,"2027-01-25":19,"2027-02-01":20,"2027-02-08":21,"2027-02-15":22,"2027-02-22":23,"2027-03-01":24,"2027-03-08":25,"2027-03-15":26,"2027-03-29":27,"2027-04-05":28,"2027-04-12":29,"2027-04-19":30,"2027-04-26":31,"2027-05-03":32,"2027-05-10":33,"2027-05-17":34,"2027-05-24":35,"2027-05-31":36,"2027-06-07":37,"2027-06-14":38,"2027-06-21":39,"2027-06-28":40};

/* ══ couleurs par type d'événement ══ */
const CATS = {
  term:"var(--c-term)", special:"var(--c-special)", test:"var(--c-test)",
  break:"var(--c-break)", holiday:"var(--c-holiday)", noschool:"var(--c-noschool)",
  jean:"var(--c-jean)", event:"var(--c-event)", work:"var(--c-work)",
  staff:"var(--c-staff)", other:"var(--c-other)"
};
const BIG = ["term","special"];

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const FIRST = new Date(2026,7,1), LAST = new Date(2027,5,1);
let cur;

function iso(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parse(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function startMonth(){ const t=today(); return new Date(t.getFullYear(), t.getMonth(), 1); }
function clampMonth(d){ return d<FIRST ? new Date(FIRST) : d>LAST ? new Date(LAST) : d; }
function monday(d){ const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function weekNo(d){ return WEEKS[iso(monday(d))] || null; }
function evOn(s){ return EVENTS.filter(e => e.d === s); }

/* ══ grille du mois ══ */
function renderGrid(){
  const g = $("grid"); g.innerHTML = "";
  const y = cur.getFullYear(), m = cur.getMonth();
  $("mtitle").innerHTML = cap(MONTHS[m]) + '<span class="m-yr">' + y + '</span>';
  $("prev").disabled = cur <= FIRST;
  $("next").disabled = cur >= LAST;

  g.appendChild(el("div","dh",""));
  DAYS.forEach((d,i) => g.appendChild(el("div","dh" + (i>=5?" we":""), d)));

  const end  = new Date(y,m+1,0);
  const tIso = iso(today());
  let d = monday(new Date(y,m,1));

  while(d <= end || d.getDay() !== 1){
    if(d.getDay() === 1){
      const w = weekNo(d);
      g.appendChild(el("div","wk", w ? "Week " + w : ""));
    }
    const s = iso(d);
    const list = evOn(s);
    const out = d.getMonth() !== m;
    const we  = d.getDay() === 0 || d.getDay() === 6;
    const fer = list.some(e => e.c === "holiday");

    const cell = el("div","cell" + (out?" out":"") + (we?" we":"") +
                                  (fer?" ferie":"") + (s===tIso?" today":""));
    cell.appendChild(el("div","num", String(d.getDate())));

    list.slice(0,3).forEach(e=>{
      const b = el("div","ev" + (BIG.includes(e.c)?" big":"") + (e.c==="holiday"?" holiday":""), e.n);
      b.style.setProperty("--k", CATS[e.c]);
      b.title = e.n;
      cell.appendChild(b);
    });
    if(list.length > 3) cell.appendChild(el("div","more","+" + (list.length-3)));

    g.appendChild(cell);
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1);
    if(d > end && d.getDay() === 1) break;
  }
}

/* ══ export agenda ══ */
$("ics").addEventListener("click", ()=>{
  const pad = s => s.replace(/-/g,"");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//St Matthew//Calendrier 2026-2027//FR","CALSCALE:GREGORIAN"];
  EVENTS.forEach((e,i)=>{
    const nx = new Date(parse(e.d).getTime() + 86400000);
    lines.push("BEGIN:VEVENT",
      "UID:stm-" + i + "-" + pad(e.d) + "@stmatthew",
      "DTSTART;VALUE=DATE:" + pad(e.d),
      "DTEND;VALUE=DATE:" + pad(iso(nx)),
      "SUMMARY:" + e.n.replace(/[,;\\]/g, c => "\\" + c),
      "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], {type:"text/calendar;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "school-calendar-2026-2027.ics";
  a.click(); URL.revokeObjectURL(a.href);
  flash(EVENTS.length + " dates exported — open the file to add them to your calendar.");
});

/* ══ divers ══ */
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){ const d=document.createElement(tag); if(cls)d.className=cls; if(txt!=null)d.textContent=txt; return d; }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function flash(msg){
  const f = $("foot"); f.textContent = msg;
  clearTimeout(f._t);
  f._t = setTimeout(()=>f.textContent="official St. Matthew calendar · public holidays are outlined in red", 4000);
}
function move(n){ cur = clampMonth(new Date(cur.getFullYear(), cur.getMonth()+n, 1)); renderGrid(); }
$("prev").addEventListener("click", ()=>move(-1));
$("next").addEventListener("click", ()=>move(1));
$("today").addEventListener("click", ()=>{ cur = clampMonth(startMonth()); renderGrid(); });
document.addEventListener("keydown", e=>{
  if(e.key === "ArrowLeft")  move(-1);
  if(e.key === "ArrowRight") move(1);
});

cur = clampMonth(startMonth());
renderGrid();
