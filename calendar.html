<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Week · Métro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#f2f0eb;            /* faïence de station */
  --tile-line:#e3e0d8;
  --encre:#1b2a4a;           /* bleu émail des plaques */
  --encre-2:#0f1d38;
  --board:#101418;           /* tableau des départs */
  --amber:#ffb428;           /* affichage du quai */
  --card:#ffffff;
  --rule:#dbe4ee;
  --muted:#7a8698;
  /* Lignes (palette RATP) */
  --l1:#FFCD00; --l2:#003CA6; --l4:#CF009E; --l5:#FF7E2E;
  --l6:#6ECA97; --l11:#8D5E2A; --l12:#007852; --l14:#62259D; --lP:#E2231A;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:'Jost',sans-serif;color:var(--encre);
  /* fond assorti aux autres onglets du site */
  background:
    radial-gradient(820px 520px at 92% -12%, rgba(42,169,224,.28), transparent 60%),
    radial-gradient(680px 460px at -8% 14%, rgba(122,111,240,.14), transparent 55%),
    linear-gradient(160deg,#DCEEFF 0%,#E6ECFA 42%,#EAF3F1 76%,#F6F8FB 100%);
  background-attachment:fixed;
  min-height:100%;
  padding:12px clamp(18px, 2.4vw, 44px) 14px;
  display:flex;flex-direction:column;
}
.wrap{width:100%;max-width:none;margin:0;flex:1;display:flex;flex-direction:column;min-height:0}

/* ── Logo ──────────────────────────────────────── */
.logocard{
  background:#fff;border-radius:12px;padding:8px 18px 6px;
  display:flex;justify-content:center;margin-bottom:8px;flex:0 0 auto;
  box-shadow:0 4px 14px rgba(27,42,74,.10);
}
.logocard img{max-height:44px;width:auto;max-width:100%}

/* ── Plaque de station ─────────────────────────── */
.plaque{
  background:var(--encre);
  border:3px solid #fff;
  outline:3px solid var(--encre);
  border-radius:10px;
  color:#fff;text-align:center;
  padding:9px 20px 8px;flex:0 0 auto;
  box-shadow:0 6px 18px rgba(27,42,74,.28);
}
.plaque h1{
  font-weight:800;font-size:clamp(18px,3vw,26px);
  letter-spacing:.16em;text-transform:uppercase;line-height:1.05;
}
.plaque .sub{
  margin-top:4px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:#b9c4dd;
}

/* ── Bandeau : jour particulier au calendrier scolaire ── */
.notice{
  margin-top:8px;flex:0 0 auto;border-radius:10px;
  padding:9px 16px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  font-weight:600;font-size:14px;line-height:1.25;
  border:2px solid var(--nc,#D9A93F);
  background:color-mix(in srgb, var(--nc,#D9A93F) 14%, #fff);
  color:var(--encre);
}
.notice .tag{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  background:var(--nc,#D9A93F);color:#fff;border-radius:999px;padding:3px 10px;flex:0 0 auto;
}
.notice small{font-weight:500;color:var(--muted);font-size:12.5px}
.notice.alert{--nc:#E2231A}
.notice.rest{--nc:#1F7A68}
.notice.info{--nc:#123F73}

/* ── Tableau des départs ───────────────────────── */
.board{
  margin-top:8px;margin-bottom:8px;background:var(--board);border-radius:12px;
  padding:10px 16px;color:var(--amber);flex:0 0 auto;
  font-family:'Space Mono',monospace;
  box-shadow:inset 0 0 0 1px #2a2f36, 0 8px 22px rgba(0,0,0,.22);
  display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;
}
.board .bhead{
  grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1px dashed #33383f;padding-bottom:6px;margin-bottom:2px;
}
.board .btitle{font-size:11px;letter-spacing:.3em;color:#8a929c;text-transform:uppercase}
.board .clock{font-size:19px;font-weight:700}
.brow{display:contents}
.brow .binfo{display:flex;align-items:center;gap:10px;min-width:0;padding:3px 0}
.brow .btag{
  font-size:10px;letter-spacing:.18em;color:#8a929c;flex:0 0 74px;text-transform:uppercase;
}
.brow .bcourse{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bwhen{font-size:14px;text-align:right;color:#ffd77e}
.dot{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:0 0 auto;animation:blink 1.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.board .bempty{grid-column:1/-1;font-size:13px;color:#8a929c;padding:6px 0}

/* ── Barre d'outils ────────────────────────────── */
.toolbar{
  display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;align-items:center;justify-content:center;flex:0 0 auto;
}
.btn{
  font-family:'Jost',sans-serif;font-weight:600;font-size:12px;letter-spacing:.05em;
  border:1.5px solid var(--encre);background:#fff;color:var(--encre);
  border-radius:999px;padding:5px 13px;cursor:pointer;transition:transform .12s, background .12s;
}
.toolbar .btn{opacity:.85;font-size:11px;padding:4px 12px}
.toolbar .btn:hover{opacity:1}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible{outline:3px solid var(--l5);outline-offset:2px}
.btn.primary{background:var(--encre);color:#fff}
.btn.on{background:var(--lP);border-color:var(--lP);color:#fff}
.toolbar .hint{font-size:12px;color:var(--muted);margin-left:auto}

/* ── Grille ────────────────────────────────────── */
.gridscroll{overflow-x:auto;border-radius:12px;flex:1 1 auto;min-height:0}
.grid{
  display:grid;min-width:760px;
  grid-template-columns:56px repeat(5,1fr);
  background:var(--card);border:2px solid var(--encre);border-radius:12px;overflow:hidden;
  box-shadow:0 10px 26px rgba(27,42,74,.14);
}
.dayhead{
  background:var(--encre);color:#fff;text-align:center;
  font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
  padding:10px 4px;position:sticky;top:0;z-index:5;
}
.dayhead.today{background:var(--lP)}
.corner{background:var(--encre)}
.timecol{position:relative;background:#f7fafd;border-right:1px solid var(--rule)}
.tlabel{
  position:absolute;right:6px;transform:translateY(-50%);
  font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);
}
.tlabel.first{transform:translateY(2px)}
.tlabel.last{transform:translateY(calc(-100% - 2px))}
.daycol{position:relative;border-right:1px solid var(--rule)}
.daycol:last-child{border-right:none}
.hline{position:absolute;left:0;right:0;border-top:1px solid #eff3f8;pointer-events:none}
.hline.hour{border-top-color:#e1e9f2}

.band{
  position:absolute;left:0;right:0;z-index:1;
  background:repeating-linear-gradient(45deg,#F6D48A 0 10px,#EFC468 10px 20px);
  border-top:2px solid #D9A93F;border-bottom:2px solid #D9A93F;
  color:var(--encre);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;overflow:hidden;
}

.course{
  position:absolute;left:5px;right:5px;z-index:2;
  background:color-mix(in srgb, var(--lc,#999) 30%, #fffdf8);
  color:var(--encre);border-radius:8px;
  border-left:4px solid var(--lc,#999);
  display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;overflow:hidden;
  box-shadow:0 2px 6px rgba(27,42,74,.14);cursor:default;
  transition:transform .12s, box-shadow .12s;
}
.editmode .course{cursor:pointer}
/* cours universitaires (P, C, B) : très légères rayures pour les distinguer */
.course.uni::before{
  content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:repeating-linear-gradient(
    45deg,
    rgba(27,42,74,.085) 0 4px,
    transparent 4px 11px
  );
}
.course > *{position:relative;z-index:1}
.editmode .course:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(27,42,74,.32)}
.course.now{box-shadow:0 0 0 2px var(--lc,#999), 0 5px 12px rgba(27,42,74,.25)}
.roundel{
  flex:0 0 30px;width:30px;height:30px;border-radius:50%;
  box-shadow:0 0 0 2px #fff;
  background:var(--lc,#999);color:var(--tc,#fff);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:12px;letter-spacing:.02em;margin-left:5px;
}
.cinfo{min-width:0;line-height:1.15}
.cname{
  font-weight:700;font-size:13.5px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;line-height:1.2;
}
.course.short .cname{-webkit-line-clamp:1;white-space:nowrap;display:block;text-overflow:ellipsis}
.ctime{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted)}
.course.short{padding-top:2px;padding-bottom:2px}
.course.short .cinfo{display:flex;align-items:baseline;gap:7px;min-width:0}
.course.short .cname{font-size:12px;flex-shrink:1}
.course.short .ctime{font-size:9.5px;white-space:nowrap}
.course.short .roundel{flex-basis:21px;width:21px;height:21px;font-size:10px}

.nowline{
  position:absolute;left:0;right:0;z-index:4;border-top:2px solid var(--lP);pointer-events:none;
}
.nowline::before{
  content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;
  background:var(--lP);box-shadow:0 0 0 3px rgba(226,35,26,.25);
}

/* ── Légende ───────────────────────────────────── */
.legend{display:flex;flex-wrap:wrap;gap:6px 0;margin-top:10px;align-items:center;justify-content:space-between;flex:0 0 auto}
.legend .li{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;white-space:nowrap}
.legend .r{width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:800;flex:0 0 auto}
.legend .uni-li{text-decoration:underline dotted rgba(27,42,74,.45);text-underline-offset:3px}

/* ── Modale d'édition ──────────────────────────── */
dialog{
  border:3px solid #fff;outline:3px solid var(--encre);border-radius:12px;
  padding:0;max-width:380px;width:92vw;background:#fff;
  box-shadow:0 20px 50px rgba(0,0,0,.3);
}
dialog::backdrop{background:rgba(16,20,24,.55)}
.mhead{background:var(--encre);color:#fff;padding:12px 18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:14px}
.mbody{padding:16px 18px;display:grid;gap:12px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.field input,.field select{
  width:100%;font-family:'Jost',sans-serif;font-size:14px;
  border:2px solid var(--rule);border-radius:8px;padding:8px 10px;background:#fff;color:var(--encre);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--encre)}
.trow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{
  width:30px;height:30px;border-radius:50%;border:3px solid transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;
}
.sw.sel{border-color:var(--encre);transform:scale(1.12)}
.mfoot{display:flex;gap:8px;padding:0 18px 18px;justify-content:flex-end}
.btn.danger{border-color:var(--lP);color:var(--lP);margin-right:auto}
.btn.danger:hover{background:var(--lP);color:#fff}

/* ═══════ VUE TÉLÉPHONE : un jour à la fois ═══════ */
.dayswitch{display:none}
.daylist{display:none}
@media (max-width:700px){
  .gridscroll{display:none}
  .dayswitch{
    display:flex;gap:6px;margin:10px 0 8px;flex:0 0 auto;
    overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .dayswitch::-webkit-scrollbar{display:none}
  .dayswitch button{
    flex:1 0 auto;min-width:62px;
    font-family:'Jost',sans-serif;font-weight:700;font-size:13px;
    border:1.5px solid var(--encre);background:#fff;color:var(--encre);
    border-radius:999px;padding:8px 12px;cursor:pointer;
  }
  .dayswitch button.on{background:var(--encre);color:#fff}
  .dayswitch button.istoday{outline:2px solid var(--lP);outline-offset:1px}

  .daylist{
    display:flex;flex-direction:column;gap:8px;flex:1 1 auto;
    overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:10px;
  }
  .dcard{
    display:flex;align-items:stretch;gap:11px;
    background:#fff;border-radius:12px;padding:11px 13px 11px 9px;
    border-left:5px solid var(--lc,#999);
    box-shadow:0 2px 8px rgba(27,42,74,.12);
  }
  .dcard.uni{
    background:
      repeating-linear-gradient(45deg,rgba(27,42,74,.055) 0 4px,transparent 4px 11px),
      #fff;
  }
  .dcard.now{box-shadow:0 0 0 2px var(--lc,#999),0 4px 12px rgba(27,42,74,.2)}
  .dcard .rd{
    flex:0 0 34px;width:34px;height:34px;border-radius:50%;align-self:center;
    background:var(--lc,#999);color:var(--tc,#fff);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
  }
  .dcard .info{min-width:0;flex:1}
  .dcard .nm{font-weight:700;font-size:15px;line-height:1.25}
  .dcard .tm{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:2px}
  .dcard .live{
    font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:#fff;background:var(--lP);border-radius:999px;padding:3px 9px;align-self:center;
  }
  .dbreak{
    text-align:center;font-size:10.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
    color:var(--encre);padding:7px;border-radius:9px;
    background:repeating-linear-gradient(45deg,#F6D48A 0 10px,#EFC468 10px 20px);
  }
  .dempty{
    text-align:center;color:var(--muted);font-size:14px;padding:34px 16px;
    background:#fff;border-radius:12px;border:1.5px dashed var(--rule);
  }
  .logocard{padding:6px 14px 4px;margin-bottom:6px}
  .logocard img{max-height:32px}
  .plaque h1{font-size:17px}
  .legend{display:none}
  .toolbar{margin-top:6px}
}

@media (max-width:640px){
  body{padding:10px 8px 12px}
  .board{grid-template-columns:1fr}
  .brow .bwhen{text-align:left;padding-left:84px}
}
</style>
</head>

const CLOSED={"2026-10-05":"Recess Week","2026-10-06":"Recess Week","2026-10-07":"Recess Week","2026-10-08":"Recess Week","2026-10-09":"Recess Week","2026-10-10":"Recess Week","2026-10-11":"Recess Week","2026-12-14":"Christmas Break","2026-12-15":"Christmas Break","2026-12-16":"Christmas Break","2026-12-17":"Christmas Break","2026-12-18":"Christmas Break","2026-12-19":"Christmas Break","2026-12-20":"Christmas Break","2026-12-21":"Christmas Break","2026-12-22":"Christmas Break","2026-12-23":"Christmas Break","2026-12-24":"Christmas Break","2026-12-25":"Christmas Break","2026-12-26":"Christmas Break","2026-12-27":"Christmas Break","2026-12-28":"Christmas Break","2026-12-29":"Christmas Break","2026-12-30":"Christmas Break","2026-12-31":"Christmas Break","2027-01-01":"Christmas Break","2027-01-02":"Christmas Break","2027-01-03":"Christmas Break","2027-01-04":"Christmas Break","2027-01-05":"Christmas Break","2027-01-06":"Christmas Break","2027-01-07":"Christmas Break","2027-01-08":"Christmas Break","2027-01-09":"Christmas Break","2027-01-10":"Christmas Break","2027-01-11":"Christmas Break","2027-01-12":"Christmas Break","2027-03-22":"Holy Week","2027-03-23":"Holy Week","2027-03-24":"Holy Week","2027-03-25":"Holy Week","2027-03-26":"Holy Week","2027-03-27":"Holy Week","2027-03-28":"Holy Week","2026-11-20":"Evaluation Day — no school for students","2027-02-15":"No school for students","2027-02-26":"Teachers' U.C.B Forum — no school for students","2027-03-19":"Evaluation Day — no school for students","2027-06-14":"Evaluation Days — no school for students","2027-06-15":"Evaluation Days — no school for students","2027-06-16":"Evaluation Days — no school for students","2027-06-17":"Evaluation Days — no school for students"};
const TERM=[["2026-08-19","2026-11-13"],["2026-11-17","2027-03-12"],["2027-03-15","2027-06-11"]];
const DAYNAME = ["","Monday","Tuesday","Wednesday","Thursday","Friday"];

function isoDate(n){
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
/* Que se passe-t-il aujourd'hui ? Renvoie le jour dont l'horaire s'applique. */
function schoolInfo(n){
  const s = isoDate(n), real = n.getDay();
  if(HOLIDAY[s])  return {day:0, kind:"rest",  tag:"Holiday",  msg:HOLIDAY[s]};
  if(CLOSED[s])   return {day:0, kind:"rest",  tag:"No class", msg:CLOSED[s]};
  if(SPECIAL[s])  return {day:SPECIAL[s].d, kind:"alert", tag:"Special",
                          msg:SPECIAL[s].n + "'s schedule applies today",
                          sub:"the calendar replaces today's timetable"};
  const inTerm = TERM.some(t => s >= t[0] && s <= t[1]);
  if(!inTerm && real>=1 && real<=5)
                  return {day:0, kind:"info", tag:"Off term", msg:"Outside the school terms"};
  return {day:real, kind:null};
}

/* ══ Utilitaires ════════════════════════════════ */
const toMin = t => { const [h,m]=t.split(":").map(Number); return h*60+m; };
const fmt   = t => t;
function nowInfo(){
  const n = new Date();
  const info = schoolInfo(n);
  return {day:info.day, realDay:n.getDay(), info,
          min:n.getHours()*60+n.getMinutes(), sec:n.getSeconds()};
}

/* bandeau affiché seulement les jours particuliers */
function renderNotice(){
  const box = document.getElementById("notice");
  const {info} = nowInfo();
  if(!info.kind){ box.hidden = true; return; }
  box.hidden = false;
  box.className = "notice " + info.kind;
  box.innerHTML = '<span class="tag">' + esc(info.tag) + '</span>' +
                  '<span>' + esc(info.msg) + '</span>' +
                  (info.sub ? '<small>' + esc(info.sub) + '</small>' : '');
}

/* ══ Hauteur : la grille remplit l'écran ════════ */
function fitPX(){
  const gs = document.querySelector(".gridscroll");
  const head = document.querySelector(".dayhead");
  if(!gs || !head) return;
  const headH = head.offsetHeight || 38;
  const avail = gs.clientHeight - headH - 4;          // place réellement libre
  if(avail <= 60) return;
  const next = avail / (END - START);
  if(Math.abs(next - PX) > 0.015){                    // seuil : évite de boucler
    PX = next;
    render();
  }
}

/* ══ Vue téléphone : un seul jour ════════════════ */
const DAYS_FR = ["","Lundi","Mardi","Mercredi","Jeudi","Vendredi"];
const DAYS_SHORT = ["","Lun","Mar","Mer","Jeu","Ven"];
let phoneDay = 0;                       // 0 = pas encore choisi

function renderPhone(){
  const sw = document.getElementById("dayswitch");
  const box = document.getElementById("daylist");
  if(!sw || !box) return;
  const {day, min} = nowInfo();
  if(!phoneDay) phoneDay = (day >= 1 && day <= 5) ? day : 1;

  sw.innerHTML = "";
  for(let d = 1; d <= 5; d++){
    const b = document.createElement("button");
    b.textContent = DAYS_SHORT[d];
    b.className = (d === phoneDay ? "on" : "") + (d === day ? " istoday" : "");
    b.addEventListener("click", ()=>{ phoneDay = d; renderPhone(); });
    sw.appendChild(b);
  }

  const list = courses.filter(c => c.d === phoneDay).sort((a,b)=>toMin(a.s)-toMin(b.s));
  if(!list.length){
    box.innerHTML = '<div class="dempty">Aucun cours le ' + DAYS_FR[phoneDay].toLowerCase() + '.</div>';
    return;
  }

  let html = "";
  let prevEnd = null;
  list.forEach(c=>{
    const s = toMin(c.s), e = toMin(c.e);
    // pause intercalée si le trou dépasse 20 minutes
    if(prevEnd !== null && s - prevEnd >= 20){
      const b = BREAKS.find(x => toMin(x.s) >= prevEnd && toMin(x.e) <= s);
      html += '<div class="dbreak">' + esc(b ? b.n : "Pause") + "</div>";
    }
    prevEnd = e;
    const L = LINES[c.l] || LINES["1"];
    const live = (phoneDay === day && min >= s && min < e);
    html += '<div class="dcard' + (UNI.includes(c.l) ? " uni" : "") + (live ? " now" : "") +
            '" style="--lc:' + L.c + ';--tc:' + L.t + '">' +
              '<span class="rd">' + esc(c.l) + '</span>' +
              '<span class="info"><span class="nm">' + esc(c.n) + '</span>' +
              '<span class="tm">' + c.s + " – " + c.e + '</span></span>' +
              (live ? '<span class="live">en cours</span>' : '') +
            '</div>';
  });
  box.innerHTML = html;
}

/* ══ Rendu de la grille ═════════════════════════ */
function render(){
  const g = document.getElementById("grid");
  g.innerHTML = "";
  const {day, min} = nowInfo();
  const H = (END-START)*PX;

  g.appendChild(el("div","corner"));
  DAYS.forEach((d,i)=>{
    const h = el("div","dayhead"+((i+1)===day?" today":""));
    h.textContent = d;
    g.appendChild(h);
  });

  // Colonne des heures
  const tc = el("div","timecol"); tc.style.height = H+"px";
  for(let m=START; m<=END; m+=60){
    const lb = el("span","tlabel"+(m===START?" first":m===END?" last":""));
    lb.style.top = (m-START)*PX+"px";
    lb.textContent = String(Math.floor(m/60)).padStart(2,"0")+":00";
    tc.appendChild(lb);
  }
  g.appendChild(tc);

  // Colonnes des jours
  for(let d=1; d<=5; d++){
    const col = el("div","daycol"); col.style.height = H+"px";

    for(let m=START; m<=END; m+=30){
      const hl = el("div","hline"+(m%60===0?" hour":""));
      hl.style.top = (m-START)*PX+"px";
      col.appendChild(hl);
    }
    if(d!==1) BREAKS.forEach(b=>{
      const bd = el("div","band");
      bd.style.top = (toMin(b.s)-START)*PX+"px";
      bd.style.height = (toMin(b.e)-toMin(b.s))*PX+"px";
      bd.textContent = b.n;
      col.appendChild(bd);
    });

    courses.filter(c=>c.d===d).forEach(c=>{
      const s = toMin(c.s), e = toMin(c.e);
      const card = el("div","course"+(((e-s)*PX)<42?" short":"")+(UNI.includes(c.l)?" uni":""));
      if(d===day && min>=s && min<e) card.classList.add("now");
      card.style.top = (s-START)*PX+2+"px";
      card.style.height = (e-s)*PX-4+"px";
      const L = LINES[c.l] || LINES["1"];
      card.style.setProperty("--lc", L.c);
      card.style.setProperty("--tc", L.t);
      card.innerHTML =
        `<span class="roundel">${c.l}</span>
         <span class="cinfo">
           <span class="cname">${esc(c.n)}</span>
           <span class="ctime">${fmt(c.s)}–${fmt(c.e)}</span>
         </span>`;
      card.addEventListener("click",()=>{ if(editMode) openModal(c.id); });
      col.appendChild(card);
    });

    if(d===day && min>=START && min<=END){
      const nl = el("div","nowline");
      nl.style.top = (min-START)*PX+"px";
      col.appendChild(nl);
    }
    g.appendChild(col);
  }
  renderLegend();
}

function renderLegend(){
  const seen = {};
  courses.forEach(c=>{ if(!seen[c.l]) seen[c.l] = c.n.replace(/ ·.*$/,""); });
  const lg = document.getElementById("legend");
  lg.innerHTML = "";
  Object.keys(seen).sort().forEach(l=>{
    const L = LINES[l]||LINES["1"];
    const it = el("div","li"+(UNI.includes(l)?" uni-li":""));
    it.innerHTML = `<span class="r" style="background:${L.c};color:${L.t}">${l}</span> ${esc(seen[l])}`;
    lg.appendChild(it);
  });
}

/* ══ Tableau des départs ════════════════════════ */
function renderBoard(){
  const {day, min} = nowInfo();
  const rows = document.getElementById("boardRows");
  const clock = document.getElementById("clock");
  const n = new Date();
  clock.textContent = String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");

  rows.innerHTML = "";
  const today = courses.filter(c=>c.d===day).sort((a,b)=>toMin(a.s)-toMin(b.s));
  const cur  = today.find(c=>min>=toMin(c.s) && min<toMin(c.e));
  const next = today.find(c=>toMin(c.s)>min);

  const push = (tag, c, when, live)=>{
    const r = document.createElement("div"); r.className="brow";
    r.innerHTML =
      `<span class="binfo">${live?'<span class="dot"></span>':""}
         <span class="btag">${tag}</span>
         <span class="bcourse">${esc(c.n)}</span></span>
       <span class="bwhen">${when}</span>`;
    rows.appendChild(r);
  };

  if(cur){
    const left = toMin(cur.e)-min;
    push("Now", cur, `ends in ${left} min`, true);
  }
  if(next){
    const wait = toMin(next.s)-min;
    push("Next", next, wait<60 ? `in ${wait} min` : `at ${next.s}`, false);
  }
  document.getElementById("board").style.display = (cur || next) ? "" : "none";
}

/* ══ Modale d'édition ═══════════════════════════ */
const modal = document.getElementById("modal");
function buildSwatches(){
  const sw = document.getElementById("swatches");
  sw.innerHTML = "";
  Object.entries(LINES).forEach(([k,v])=>{
    const b = el("button","sw"+(k===selLine?" sel":""));
    b.type="button"; b.style.background=v.c; b.style.color=v.t; b.textContent=k;
    b.addEventListener("click",()=>{ selLine=k; buildSwatches(); });
    sw.appendChild(b);
  });
}
function openModal(id){
  editingId = id;
  const c = courses.find(x=>x.id===id);
  document.getElementById("mtitle").textContent = c ? "Edit class" : "New class";
  document.getElementById("delBtn").style.display = c ? "" : "none";
  document.getElementById("fName").value  = c ? c.n : "";
  document.getElementById("fDay").value   = c ? c.d : (nowInfo().day||1);
  document.getElementById("fStart").value = c ? c.s : "07:00";
  document.getElementById("fEnd").value   = c ? c.e : "08:00";
  selLine = c ? c.l : "1";
  buildSwatches();
  modal.showModal();
}
document.getElementById("saveBtn").addEventListener("click",()=>{
  const n = document.getElementById("fName").value.trim() || "Cours";
  const d = Number(document.getElementById("fDay").value);
  const s = document.getElementById("fStart").value || "07:00";
  const e = document.getElementById("fEnd").value   || "08:00";
  if(toMin(e)<=toMin(s)){ flash("End time must be after start time"); return; }
  if(editingId){
    const c = courses.find(x=>x.id===editingId);
    Object.assign(c,{n,d,s,e,l:selLine});
  }else{
    courses.push({id:"c"+Date.now(), n,d,s,e, l:selLine});
  }
  modal.close(); save(); render(); renderBoard(); renderNotice(); renderPhone(); fitPX();
});
document.getElementById("delBtn").addEventListener("click",()=>{
  courses = courses.filter(x=>x.id!==editingId);
  modal.close(); save(); render(); renderBoard(); renderPhone(); fitPX();
});
document.getElementById("cancelBtn").addEventListener("click",()=>modal.close());

/* ══ Barre d'outils ═════════════════════════════ */
document.getElementById("editBtn").addEventListener("click",e=>{
  editMode = !editMode;
  document.body.classList.toggle("editmode", editMode);
  e.currentTarget.classList.toggle("on", editMode);
  e.currentTarget.textContent = editMode ? "✓ Done" : "✎ Edit";
  document.getElementById("addBtn").hidden = !editMode;
  flash(editMode ? "Click any class to edit it" : "");
});
document.getElementById("addBtn").addEventListener("click",()=>openModal(null));

document.getElementById("exportBtn").addEventListener("click",()=>{
  const blob = new Blob([JSON.stringify(courses,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "my-week.json";
  a.click(); URL.revokeObjectURL(a.href);
});

/* ══ Divers ═════════════════════════════════════ */
function el(tag, cls){ const d = document.createElement(tag); if(cls) d.className = cls; return d; }
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

render(); renderBoard(); renderNotice(); renderPhone(); fitPX();
requestAnimationFrame(fitPX);                   // 2e passe : polices chargées
window.addEventListener("resize", fitPX);
setInterval(()=>{ renderBoard(); renderNotice(); renderPhone();
  const {min} = nowInfo();
  if(min !== window._lastMin){ window._lastMin = min; render(); }
}, 5000);
</script>
